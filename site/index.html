<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MiniShop</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 40px 16px; }
  main { max-width: 460px; margin: 0 auto; background: #fff; padding: 24px 28px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { margin: 0; }
  #goal { color: #666; margin: 4px 0 20px; }
  #info { font-size: 20px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 6px 0; }
  button { font: inherit; padding: 8px 16px; margin: 4px 4px 4px 0; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }
  #app.loading button { display: none; }
  #popup { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  #popup[hidden] { display: none; }
  #popup div { background: #fff; padding: 24px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1>MiniShop</h1>
  <p id="goal"></p>
  <div id="app"></div>
</main>
<div id="popup" hidden><div><p>Special offer! Sign up today.</p><button onclick="popup.hidden = true">Dismiss</button></div></div>
<script>
const PRODUCTS = ["blue-mug", "red-mug", "green-shirt", "black-cap"];
const params = new URLSearchParams(location.search);
const popupP = Number(params.get("popup_p"));
const delayP = Number(params.get("delay_p"));
const rand = mulberry32(Number(params.get("seed")));
const app = document.getElementById("app");
const popup = document.getElementById("popup");
const state = { screen: "catalog", product: null, qty: 1, cart: null, order: null };
let screenId = 0;

document.getElementById("goal").textContent = `Goal: ${params.get("item")} x${params.get("qty")}`;

function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const SCREENS = {
  catalog: () => PRODUCTS.map(p => `<div class="row">${p} <button onclick="view('${p}')">View</button></div>`).join("")
    + `<button onclick="go('newsletter')">Newsletter</button>`,
  newsletter: () => `<p>Subscribe to our newsletter!</p>
    <button onclick="go('catalog')">Back</button>`,
  product: () => `<p id="info">${state.product} x${state.qty}</p>
    <button onclick="changeQty(-1)">-</button>
    <button onclick="changeQty(1)">+</button>
    <button onclick="addToCart()">Add to cart</button>
    <button onclick="go('catalog')">Back</button>`,
  cart: () => `<p id="info">${state.cart ? state.cart.item + " x" + state.cart.qty : "empty"}</p>
    <button onclick="checkout()" ${state.cart ? "" : "disabled"}>Checkout</button>
    <button onclick="clearCart()">Clear cart</button>
    <button onclick="go('product')">Back</button>`,
  done: () => `<p id="info">Order placed: ${state.order.item} x${state.order.qty}</p>`,
};

function render() {
  document.body.dataset.screen = state.screen;
  app.innerHTML = SCREENS[state.screen]();
}

function go(screen) {
  state.screen = screen;
  render();
  const id = ++screenId;
  const showPopup = rand() < popupP, delayed = rand() < delayP, delayMs = 50 + Math.floor(rand() * 251);
  popup.hidden = !showPopup;
  app.classList.toggle("loading", delayed);
  if (delayed) setTimeout(() => { if (id === screenId) app.classList.remove("loading"); }, delayMs);
}

function view(p) { state.product = p; state.qty = 1; go("product"); }
function changeQty(d) { state.qty = Math.min(3, Math.max(1, state.qty + d)); render(); }
function addToCart() { state.cart = { item: state.product, qty: state.qty }; go("cart"); }
function clearCart() { state.cart = null; render(); }
function checkout() { state.order = { ...state.cart }; go("done"); }

go("catalog");
</script>
</body>
</html>
